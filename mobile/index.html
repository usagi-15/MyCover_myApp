<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My Cover</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="head">
  <h1>My Cover</h1>
  <p class="no" id="no"></p>
</header>

<main id="main">
  <!-- 読み込み中 -->
  <section id="loading" class="panel center">
    <p class="msg" id="loading-msg">読み込んでいます…</p>
  </section>

  <!-- M1 曲とジャケット p.14 -->
  <section id="m1" class="panel hidden">
    <!-- 長押しで保存できるよう <img> で置く（背景画像にしない） -->
    <img id="jacket" class="jacket" alt="あなたの『My Cover』ジャケット">
    <p class="track-title" id="track-title"></p>
    <p class="artist" id="artist"></p>
    <div class="player">
      <button class="play" id="play" aria-label="再生"></button>
      <div class="bar">
        <input type="range" id="seek" min="0" step="0.1" value="0" aria-label="再生位置">
        <div class="times"><span id="pos">0´00”</span><span id="dur">-´--”</span></div>
      </div>
    </div>
    <a class="download" id="download" download>Download (MP3)</a>
    <p class="hint">ジャケットを長押しすると画像として保存できます</p>
    <div class="prompt">
      <p class="label">入力したプロンプト</p>
      <p class="prompt-text" id="prompt"></p>
    </div>
  </section>

  <!-- M2 未ひも付けカード p.15 -->
  <section id="m2" class="panel hidden">
    <div class="jacket empty"><span>まだジャケットがありません</span></div>
    <h2 class="m2-title">このカードにはまだジャケットが<br>ひもづいていません</h2>
    <p class="m2-desc">会場でジャケットを作成し、完成後「Take It Home（カードで持ち帰る）」を選択すると、このカードにあなたのジャケットと楽曲がひもづきます。</p>
    <div class="info" id="info"></div>
  </section>

  <!-- エラー -->
  <section id="error" class="panel center hidden">
    <p class="msg" id="error-msg"></p>
    <div class="info" id="info-error"></div>
  </section>
</main>

<footer class="foot">
  <a id="author" class="hidden" target="_blank" rel="noopener">『My Cover』・作者 HP へ</a>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
